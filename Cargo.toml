[workspace]
resolver = "2"
members = [
    "crates/agent-canvas-core",
    "crates/agent-canvas-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/velox/agent-canvas"

[workspace.dependencies]
agent-canvas-core = { path = "crates/agent-canvas-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "3"
url = "2"
tempfile = "3"
wiremock = "0.6"
