# Tag-driven GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Always: create a GitHub Release (notes + source). Notarized macOS DMGs are
# attached by the private companion repo (agent-canvas-release).
#
# Optional unsigned macOS .app zip: set ENABLE_MACOS_RELEASE=true (or
# workflow_dispatch build_macos=true). Prefer the private notarized path.
#
# No standalone Linux MCP binary — the MCP is only useful with a host UI
# (macOS today; Windows next). CI still builds/tests MCP on Ubuntu.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Leave empty to use the pushed tag."
        required: false
        type: string
      build_macos:
        description: "Build unsigned macOS .app zip (use self-hosted Mac via MACOS_RUNS_ON)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-app:
    name: macOS app (optional)
    if: >-
      ${{
        (vars.CI_DISABLED != 'true' || github.event_name == 'workflow_dispatch') &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.build_macos == true) ||
          (github.event_name == 'push' && vars.ENABLE_MACOS_RELEASE == 'true')
        )
      }}
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '["macos-14"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Xcode CLI path
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            if [[ "$(xcode-select -p 2>/dev/null)" != "/Applications/Xcode.app/Contents/Developer" ]]; then
              sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || \
                sudo xcode-select -s /Applications/Xcode.app
            fi
          fi
          xcodebuild -version

      - name: Ensure XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate + build (unsigned)
        working-directory: platforms/macos
        run: |
          xcodegen generate
          xcodebuild \
            -project AgentCanvas.xcodeproj \
            -scheme AgentCanvas \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ../../build/ci-macos-release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app
        run: |
          mkdir -p dist
          APP=$(find build/ci-macos-release/Build/Products/Release -name 'AgentCanvas.app' -type d | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/AgentCanvas-macos-unsigned.zip
          (cd dist && shasum -a 256 AgentCanvas-macos-unsigned.zip > SHA256SUMS-macos.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/
          retention-days: 14

  publish:
    name: GitHub Release
    needs: [macos-app]
    # macos-app is optional — don't block when skipped
    if: >-
      ${{
        always() &&
        (vars.CI_DISABLED != 'true' || github.event_name == 'workflow_dispatch') &&
        (needs.macos-app.result == 'success' || needs.macos-app.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Download macOS app (if present)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/**
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
