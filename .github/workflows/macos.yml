# macOS / Xcode validation.
#
# Default: manual only (workflow_dispatch).
# Opt-in on PR/push: repo variable ENABLE_MACOS_CI=true
# Runner: repo variable MACOS_RUNS_ON (JSON label array). Prefer self-hosted Mac.
#   gh variable set MACOS_RUNS_ON --body '["self-hosted","macOS","ARM64"]'
# Fallback without the variable: GitHub-hosted macos-14 (paid).
# Kill-switch: CI_DISABLED=true

name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platforms/macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "platforms/macos/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: XcodeGen · build (no codesign)
    # Manual always allowed; automatic only when ENABLE_MACOS_CI=true
    if: >-
      ${{
        vars.CI_DISABLED != 'true' &&
        (github.event_name == 'workflow_dispatch' || vars.ENABLE_MACOS_CI == 'true')
      }}
    # Self-hosted needs an array of labels, e.g. ["self-hosted","macOS","ARM64"].
    runs-on: ${{ fromJSON(vars.MACOS_RUNS_ON || '["macos-14"]') }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Xcode CLI path
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            if [[ "$(xcode-select -p 2>/dev/null)" != "/Applications/Xcode.app/Contents/Developer" ]]; then
              sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || \
                sudo xcode-select -s /Applications/Xcode.app
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate project
        working-directory: platforms/macos
        run: xcodegen generate

      - name: Build (CODE_SIGNING_ALLOWED=NO)
        working-directory: platforms/macos
        env:
          # Unsigned CI build — signing/notarization belongs in release when ready.
          CODE_SIGNING_ALLOWED: NO
        run: |
          xcodebuild \
            -project AgentCanvas.xcodeproj \
            -scheme AgentCanvas \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath ../../build/ci-macos \
            CODE_SIGNING_ALLOWED=NO \
            build
