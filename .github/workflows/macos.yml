# macOS / Xcode validation — expensive on GitHub-hosted runners (~10–30× Linux).
#
# Default: manual only (workflow_dispatch).
# Opt-in on every PR/push: set repo variable ENABLE_MACOS_CI=true
# Self-hosted later: set MACOS_RUNNER to your runner label (e.g. self-hosted-macos)
# Kill-switch: CI_DISABLED=true

name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platforms/macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "platforms/macos/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: XcodeGen · build (no codesign)
    # Manual always allowed; automatic only when ENABLE_MACOS_CI=true
    if: >-
      ${{
        vars.CI_DISABLED != 'true' &&
        (github.event_name == 'workflow_dispatch' || vars.ENABLE_MACOS_CI == 'true')
      }}
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: platforms/macos
        run: xcodegen generate

      - name: Build (CODE_SIGNING_ALLOWED=NO)
        working-directory: platforms/macos
        env:
          # Unsigned CI build — signing/notarization belongs in release when ready.
          CODE_SIGNING_ALLOWED: NO
        run: |
          xcodebuild \
            -project AgentCanvas.xcodeproj \
            -scheme AgentCanvas \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath ../../build/ci-macos \
            CODE_SIGNING_ALLOWED=NO \
            build
